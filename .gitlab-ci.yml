---
# GitLab CI/CD pipeline for aarch32-port-jdk8u
#
# Builds OpenJDK 8 for ARM32 (armhf / AArch32 hard-float) on an ARM64 runner
# that supports 32-bit userspace execution, then verifies the image by running
# the jdk_tier1 and hotspot_tier1 jtreg regression test groups.
#
# Runner requirement: tags "linux k8s aarch64 arm64 16x32 dind zulu"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    # Suppress redundant branch pipeline when an MR is already open for the branch
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never

stages:
  - ci

# ── Shared variables ────────────────────────────────────────────────────────

variables:
  # Azul Zulu 8 for AArch64 – used as the build-host (boot) JDK.
  BOOT_JDK_ARCHIVE: "zulu8.90.0.19-ca-jdk8.0.472-linux_aarch64.tar.gz"
  BOOT_JDK_URL: "https://cdn.azul.com/zulu/bin/zulu8.90.0.19-ca-jdk8.0.472-linux_aarch64.tar.gz"
  BOOT_JDK_DIR: "zulu8.90.0.19-ca-jdk8.0.472-linux_aarch64"

  # jtreg – test harness (from Azul internal nexus).
  # Version must satisfy the minimum stated in hotspot/test/TEST.ROOT (4.2 b13).
  JTREG_VERSION: "5.1-b01"
  JTREG_ARCHIVE: "jtreg-5.1-b01.tar.gz"
  JTREG_URL: "https://nexus.azulsystems.com/repository/zulu-binaries/jtreg/jtreg-5.1-b01.tar.gz"

  # Parallel jobs – matches the 16-core capacity advertised by the runner tag.
  JOBS: "16"

  WEB_RUN_JOB:
    description: "Select job to run when triggered from Web UI"
    value: "build"
    options:
      - "build"
      - "sync"

# ── Build and Test (single job) ──────────────────────────────────────────────

build_and_test_jdk:
  image: debian:11
  tags:
    - linux
    - k8s
    - aarch64
    - arm64
    - 16x32
    - dind
    - zulu
  stage: ci
  timeout: 4h
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $WEB_RUN_JOB == "build"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - when: never

  before_script:
    - hostname -I
    # ── 1. Add ARM hard-float (armhf) architecture and install packages ──────
    #    The *-dev:armhf packages pull in their runtime counterparts as
    #    dependencies, so a single install step covers both build and test.
    - dpkg --add-architecture armhf
    - apt-get update -qq
    - |
      DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
        ca-certificates rsync make gcc g++ zip unzip autoconf \
        file wget curl libz-dev procps \
        gcc-10-arm-linux-gnueabihf g++-10-arm-linux-gnueabihf \
        libx11-dev:armhf libxext-dev:armhf libxrender-dev:armhf \
        libxrandr-dev:armhf libxtst-dev:armhf libxt-dev:armhf \
        libcups2-dev:armhf libfontconfig1-dev:armhf libasound2-dev:armhf \
        libfreetype6-dev:armhf libpng-dev:armhf libstdc++-10-dev:armhf \
        libz-dev:armhf
    # ── 2. Register versioned cross-compiler as the default alternative ───────
    - |
      update-alternatives \
        --install /usr/bin/arm-linux-gnueabihf-gcc arm-linux-gnueabihf-gcc \
        /usr/bin/arm-linux-gnueabihf-gcc-10 100
    - |
      update-alternatives \
        --install /usr/bin/arm-linux-gnueabihf-g++ arm-linux-gnueabihf-g++ \
        /usr/bin/arm-linux-gnueabihf-g++-10 100
    # ── 3. Download and unpack the Zulu 8 aarch64 boot JDK ───────────────────
    - wget --no-verbose -O "${BOOT_JDK_ARCHIVE}" "${BOOT_JDK_URL}"
    - tar -xzf "${BOOT_JDK_ARCHIVE}"
    - echo "Boot JDK -> ${CI_PROJECT_DIR}/${BOOT_JDK_DIR}"
    # ── 4. Download and unpack jtreg (needed by configure --with-jtreg) ───────
    - wget --no-verbose -O "${JTREG_ARCHIVE}" "${JTREG_URL}"
    - mkdir -p jtreg && tar -xzf "${JTREG_ARCHIVE}" --strip-components=1 -C jtreg
    - echo "jtreg -> ${CI_PROJECT_DIR}/jtreg  ($(ls jtreg/bin/))"

  script:
    - |
      set -euo pipefail

      # ── Configure ───────────────────────────────────────────────────────────
      # CC/CXX must be exported explicitly; --openjdk-target alone does not
      # override the autoconf compiler detection that runs before the target
      # platform is fully processed.
      CC=arm-linux-gnueabihf-gcc \
      CXX=arm-linux-gnueabihf-g++ \
      BUILD_CC=gcc \
      BUILD_CXX=g++ \
      bash ./configure \
        --with-boot-jdk="${CI_PROJECT_DIR}/${BOOT_JDK_DIR}" \
        --openjdk-target=arm-linux-gnueabihf \
        --with-jtreg="${CI_PROJECT_DIR}/jtreg" \
        --with-jvm-variants=client \
        --with-jobs=${JOBS} \
        --with-debug-level=release

      # ── Build JDK + JRE images ───────────────────────────────────────────────
      make images JOBS=${JOBS} LOG=info

      # ── Locate the built JDK image ───────────────────────────────────────────
      TEST_JDK=$(find "${CI_PROJECT_DIR}/build" -maxdepth 3 \
                      -name "j2sdk-image" -type d | head -1)
      if [ -z "${TEST_JDK}" ]; then
        echo "ERROR: j2sdk-image not found"; exit 1
      fi
      echo "Test JDK: ${TEST_JDK}"

      # Confirm the ARM32 JVM starts correctly on this aarch64 kernel
      "${TEST_JDK}/bin/java" -version

      # ── Download ProblemLists from gitlab-ci branch ───────────────────────────
      echo "Downloading exclude lists from gitlab-ci branch..."
      mkdir -p "${CI_PROJECT_DIR}/jdk/test" "${CI_PROJECT_DIR}/hotspot/test"
      curl --fail --silent --show-error \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/files/jdk%2Ftest%2FProblemList-aarch32.txt/raw?ref=gitlab-ci" \
        -o "${CI_PROJECT_DIR}/jdk/test/ProblemList-aarch32.txt"
      curl --fail --silent --show-error \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/files/hotspot%2Ftest%2FProblemList-aarch32.txt/raw?ref=gitlab-ci" \
        -o "${CI_PROJECT_DIR}/hotspot/test/ProblemList-aarch32.txt"

      # ── Run jdk tests ─────────────────────────────────────────────────────────
      # Run jdk_lang, jdk_util, jdk_math separately instead of jdk_tier1 because
      # jdk_jdi (com/sun/jdi) fails entirely on aarch32 due to JDWP agent
      # communication issues — all those tests are excluded via ProblemList but
      # running them wastes time; omitting jdk_jdi avoids the noise.
      JDK_RC=0
      "${CI_PROJECT_DIR}/jtreg/bin/jtreg" \
        -jdk:"${TEST_JDK}" \
        -agentvm \
        -verbose:fail,error \
        -xml \
        -timeout:0.25 \
        -exclude:"${CI_PROJECT_DIR}/jdk/test/ProblemList-aarch32.txt" \
        -r:"${CI_PROJECT_DIR}/jtreg-results/jdk/JTreport" \
        -w:"${CI_PROJECT_DIR}/jtreg-results/jdk/JTwork" \
        -dir:"${CI_PROJECT_DIR}/jdk/test" \
        :jdk_lang :jdk_util :jdk_math || JDK_RC=$?

      # ── Run hotspot test (single case for quick CI validation) ───────────────
       HOTSPOT_RC=0
       "${CI_PROJECT_DIR}/jtreg/bin/jtreg" \
         -jdk:"${TEST_JDK}" \
         -agentvm \
         -verbose:fail,error \
         -xml \
         -timeout:0.25 \
         -exclude:"${CI_PROJECT_DIR}/hotspot/test/ProblemList-aarch32.txt" \
         -r:"${CI_PROJECT_DIR}/jtreg-results/hotspot/JTreport" \
         -w:"${CI_PROJECT_DIR}/jtreg-results/hotspot/JTwork" \
         -dir:"${CI_PROJECT_DIR}/hotspot/test" \
         :hotspot_tier1 || HOTSPOT_RC=$?

      # ── Print combined summary ────────────────────────────────────────────────
      echo "=== Test Summary ==="
      for summary in "${CI_PROJECT_DIR}/jtreg-results"/*/JTreport/text/summary.txt; do
        echo "--- ${summary} ---"
        cat "${summary}" || true
        echo ""
      done
      echo "jdk_tier1 RC=${JDK_RC}  hotspot_tier1 RC=${HOTSPOT_RC}"

      # jtreg exit codes:
      #   0 = all tests passed
      #   1 = test failures/errors
      #   2 = some tests had errors
      #  >=3 = jtreg setup / config error (bad -exclude file, missing JDK, etc.)
      # All known aarch32 failures are listed in ProblemList-aarch32.txt and
      # excluded above, so any non-zero RC is unexpected and must fail CI.
      FINAL_RC=0
      if [ "${JDK_RC}" -ne 0 ]; then
        echo "ERROR: jdk_tier1 failed (RC=${JDK_RC})"
        FINAL_RC=1
      fi
      if [ "${HOTSPOT_RC}" -ne 0 ]; then
        echo "ERROR: hotspot_tier1 failed (RC=${HOTSPOT_RC})"
        FINAL_RC=1
      fi
      exit ${FINAL_RC}

  artifacts:
    name: "jdk8-aarch32-${CI_COMMIT_SHORT_SHA}"
    when: always
    paths:
      - jtreg-results/
    reports:
      junit:
        # jtreg -xml writes per-test JUnit XML as *.jtr.xml in JTwork/.
        # GitLab collects them all via the glob and renders them in the
        # pipeline Tests tab — no intermediate aggregation script needed.
        - jtreg-results/**/*.jtr.xml
    expire_in: 1 week

# ── Upstream sync (scheduled) ─────────────────────────────────────────────────
#
# Periodically checks https://github.com/openjdk/jdk8u for new
# tags and, when found, opens a GitLab MR that merges each new tag in version
# order onto master.
#
# Prerequisites:
#   • Create a GitLab scheduled pipeline (CI/CD → Schedules) targeting the
#     gitlab-ci branch.  Any interval (e.g. daily) works.
#   • Set the CI/CD variable  GITLAB_API_TOKEN  to a project or personal access
#     token with `api` scope and at least Developer role on this project.

sync_upstream_tags:
  image: debian:12-slim
  stage: ci
  tags:
    - linux
    - k8s
    - aarch64
    - arm64
    - zulu
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web" && $WEB_RUN_JOB == "sync"
    - when: never
  variables:
    UPSTREAM_URL: "https://github.com/openjdk/jdk8u.git"
    SYNC_BASE_BRANCH: "master"
    # Set to "true" to skip git push and MR creation (safe for testing)
    SYNC_DRY_RUN: "false"
    # Full clone so that all tags and history are available for merge-base checks
    GIT_DEPTH: "0"

  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends git curl ca-certificates jq
    - git config --global user.name "Sergey Nazarkin"
    - git config --global user.email "snazarki@openjdk.org"

  script:
    - |
      set -euo pipefail

      # ── Fetch upstream and ensure the base branch is current ──────────────
      git remote add upstream "${UPSTREAM_URL}"
      git fetch upstream --tags --no-recurse-submodules
      git fetch origin "${SYNC_BASE_BRANCH}"

      # ── Identify upstream tags not yet merged into the base branch ────────
      # Using merge-base --is-ancestor is more accurate than comparing tag
      # name lists: it catches tags that were merged without being mirrored
      # locally, and skips tags whose commits are already reachable.
      NEW_TAGS=""
      while IFS= read -r TAG; do
        [ -z "${TAG}" ] && continue
        if ! git merge-base --is-ancestor "${TAG}" "origin/${SYNC_BASE_BRANCH}" 2>/dev/null; then
          NEW_TAGS="${TAG}"$'\n'"${NEW_TAGS}"
        else
          break
        fi
      done < <(git ls-remote --tags --sort=-v:refname upstream \
                  | grep -v '\^{}' \
                  | sed 's|.*refs/tags/||')

      # Remove trailing blank lines
      NEW_TAGS=$(printf '%s' "${NEW_TAGS}" | sed '/^[[:space:]]*$/d')

      if [ -z "${NEW_TAGS}" ]; then
        echo "Already up to date – no unmerged upstream tags found."
        exit 0
      fi

      echo "Upstream tags to merge (in version order):"
      echo "${NEW_TAGS}"

      # ── Create a sync branch from the base branch ─────────────────────────
      SYNC_BRANCH="sync/upstream-$(date -u +%Y%m%d-%H%M%S)"
      git checkout -b "${SYNC_BRANCH}" "origin/${SYNC_BASE_BRANCH}"

      # ── Merge each new tag in version order ───────────────────────────────
      # Fails immediately on merge conflict so a human can resolve it.
      while IFS= read -r TAG; do
        [ -z "${TAG}" ] && continue
        echo "=== Merging ${TAG} ==="
        git merge --no-ff -m "Merge upstream tag ${TAG}" "${TAG}"
      done <<< "${NEW_TAGS}"

      # ── Compose MR title and description ──────────────────────────────────
      TAG_COUNT=$(echo "${NEW_TAGS}" | wc -l | tr -d ' ')
      FIRST_TAG=$(echo "${NEW_TAGS}" | head -1)
      LAST_TAG=$(echo "${NEW_TAGS}"  | tail -1)
      TAG_BULLETS=$(echo "${NEW_TAGS}" | sed 's/^/- /')

      if [ "${TAG_COUNT}" -eq 1 ]; then
        MR_TITLE="sync: merge upstream tag ${FIRST_TAG}"
      else
        MR_TITLE="sync: merge ${TAG_COUNT} upstream tags (${FIRST_TAG}..${LAST_TAG})"
      fi

      MR_DESC=$(printf \
        "Automated upstream sync from \`%s\`.\n\n### Merged tags (%s)\n\n%s" \
        "${UPSTREAM_URL}" "${TAG_COUNT}" "${TAG_BULLETS}")

      if [ "${SYNC_DRY_RUN}" = "true" ]; then
        echo ""
        echo "=== DRY RUN — skipping git push and MR creation ==="
        echo "Would push branch : ${SYNC_BRANCH}"
        echo "Would open MR     : ${MR_TITLE}"
        echo "MR description    :"
        echo "${MR_DESC}"
        exit 0
      fi

      # ── Push the sync branch ──────────────────────────────────────────────
      git remote set-url origin \
        "https://oauth2:${GITLAB_API_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git push origin "${SYNC_BRANCH}"

      # ── Open the MR via GitLab API ────────────────────────────────────────
      curl --fail --silent --show-error \
        --request POST \
        --url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests" \
        --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "$(jq -n \
          --arg source "${SYNC_BRANCH}" \
          --arg target "${SYNC_BASE_BRANCH}" \
          --arg title  "${MR_TITLE}" \
          --arg desc   "${MR_DESC}" \
          '{source_branch:$source,
            target_branch:$target,
            title:$title,
            description:$desc,
            remove_source_branch:true}')"

      echo ""
      echo "MR opened: ${SYNC_BRANCH} → ${SYNC_BASE_BRANCH}"
